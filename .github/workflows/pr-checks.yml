name: PR Checks

on:
  pull_request:
    branches:
      - main
      - staging
  workflow_dispatch:

jobs:
  backend-syntax:
    name: Backend Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Backend Dependencies
        run: npm ci

      - name: Validate Backend Syntax
        run: npm run check:backend

      - name: Validate Backend Syntax (Postgres Runtime Mode)
        run: npm run check:backend:postgres

      - name: Validate Native SQLite Runtime
        run: node -e "const Database = require('better-sqlite3'); const db = new Database(':memory:'); const row = db.prepare('SELECT 1 AS ok').get(); db.close(); if (row.ok !== 1) throw new Error('better-sqlite3 smoke failed')"

      - name: Build Railway Runtime Image
        run: docker build --tag vellic-backend-pr .

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci --prefix frontend

      - name: Test Frontend
        run: npm --prefix frontend test

      - name: Build Frontend
        run: CI=false npm --prefix frontend run build

  marketing-check:
    name: Marketing Static Export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: marketing/package-lock.json

      - name: Install Marketing Dependencies
        run: npm ci --prefix marketing

      - name: Validate Marketing Static Export
        run: npm --prefix marketing run check
