<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico?v=20260430-2" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg?v=20260430-2" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Vellic - Visual Sitemap Generator"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png?v=20260430-2" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Vellic</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <script>
      (function () {
        var host = window.location.hostname;
        var isLocalHost = host === 'localhost'
          || host === '127.0.0.1'
          || host === '0.0.0.0'
          || host === '[::1]'
          || host === '::1';
        if (!isLocalHost) return;

        var params = new URLSearchParams(window.location.search || '');
        if (params.get('figmaForceLoggedOut') === '1') {
          window.localStorage.removeItem('vellic_auth_token');
          window.localStorage.removeItem('mapmat_auth_token');
        }
        var authToken = params.get('figmaAuthToken');
        if (authToken) {
          window.localStorage.setItem('vellic_auth_token', authToken);
          window.localStorage.removeItem('mapmat_auth_token');
        }
        if (params.get('figmaWelcomeHidden') === '1') {
          window.localStorage.setItem('vellic:welcome-modal-hidden:v1', 'true');
          window.localStorage.removeItem('mapmat:welcome-modal-hidden:v1');
        }
      }());
    </script>
    <div id="root"></div>
    <script src="%PUBLIC_URL%/figma-capture.js" async></script>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
